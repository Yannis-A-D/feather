[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "feather-render"
version = "0.4.3"
description = "Blazing-fast, anti-aliased 2D vector rendering & image processing extension for Python"
readme = "README.md"
authors = [{ name = "Feather Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rendering", "graphics", "vector", "antialiasing", "image-processing", "pillow-alternative", "skia", "simd", "feather"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.scripts]
feather = "feather.cli:main"

[project.optional-dependencies]
dev = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "feather._feather"
